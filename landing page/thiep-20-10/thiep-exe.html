<html lang="vi">
<head>

<meta property="og:description" content="ThiệpOS 20.10 · cài đặt hạnh phúc, quét virus buồn phiền, và một nút Không biết bỏ chạy.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#2A8C8C; --silver:#C3C3C3; --dark:#808080; --darker:#0A0A0A; --light:#FFFFFF; --hilite:#DFDFDF;
  --title1:#B4246C; --title2:#F49AC1; --navy:#000080; --tip:#FFFFE1; --pink:#F49AC1;
  --px:'VT323',ui-monospace,monospace; --ui:'Be Vietnam Pro',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow:hidden;background:var(--desk);font-family:var(--px);font-size:20px;color:#000;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.bevel{box-shadow:inset -1px -1px var(--darker),inset 1px 1px var(--light),inset -2px -2px var(--dark),inset 2px 2px var(--hilite)}
.sunken{box-shadow:inset -1px -1px var(--light),inset 1px 1px var(--dark),inset -2px -2px var(--hilite),inset 2px 2px var(--darker)}

/* desktop */
#desk{position:fixed;inset:0 0 44px 0;overflow:hidden;
  background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.18),transparent 30%),
             repeating-conic-gradient(rgba(0,0,0,.035) 0 25%,transparent 0 50%) 0 0/4px 4px,
             linear-gradient(160deg,#2F9696,#257C7C)}
.watermark{position:absolute;right:4vw;bottom:2vh;font:clamp(90px,22vw,260px)/1 var(--px);color:rgba(255,255,255,.13);pointer-events:none;text-align:right}
.watermark small{display:block;font-size:.2em;letter-spacing:.1em}
.cloud{position:absolute;width:120px;height:36px;background:rgba(255,255,255,.55);box-shadow:24px -16px 0 -4px rgba(255,255,255,.55),56px -8px 0 -2px rgba(255,255,255,.55);image-rendering:pixelated;animation:float 60s linear infinite}
@keyframes float{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.icons{position:absolute;left:8px;top:10px;display:grid;grid-auto-flow:row;gap:6px;z-index:1}
.icon{width:92px;padding:6px 4px;border:1px dotted transparent;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;text-align:center}
.icon .ic{font-size:34px;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.icon .lb{font:18px/1 var(--px);color:#fff;text-shadow:1px 1px 0 #000;padding:2px 3px}
.icon:focus-visible,.icon.sel{border-color:#fff}
.icon.sel .lb,.icon:focus-visible .lb{background:var(--navy)}

/* windows */
.win{position:absolute;background:var(--silver);padding:3px;min-width:220px;max-width:calc(100vw - 12px);z-index:10}
.win.pop{animation:pop .22s steps(4) both}
.win.closing{animation:pop .16s steps(3) reverse both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 3px 2px 6px;background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff;cursor:grab;touch-action:none}
.win.blur .tb{background:linear-gradient(90deg,#7B7B7B,#B5B5B5)}
.ti{font:20px/1.1 var(--px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb{display:flex;gap:2px;flex:none}
.tbtn{width:22px;height:20px;border:0;background:var(--silver);font:16px/1 var(--px);display:grid;place-items:center;cursor:pointer;padding:0;color:#000}
.wb{padding:12px}
.btn{min-width:84px;padding:6px 14px;border:0;background:var(--silver);cursor:pointer;font:20px/1 var(--px);color:#000}
.btn:active,.tbtn:active,.btn.on{box-shadow:inset -1px -1px var(--light),inset 1px 1px var(--darker),inset -2px -2px var(--hilite),inset 2px 2px var(--dark)}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn:disabled{color:var(--dark);text-shadow:1px 1px 0 #fff;cursor:not-allowed}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative}
.msg{display:flex;gap:14px;align-items:flex-start;font-size:21px;line-height:1.15}
.msg .big{font-size:40px;line-height:1}
.prog{height:26px;padding:3px;margin-top:10px;background:#fff}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--title1) 0 14px,transparent 14px 17px)}
.status{font-size:19px;color:#333;min-height:1.2em;margin-top:8px}
.paper{background:#fff;padding:10px 12px;font:22px/1.2 var(--px);min-height:150px;max-height:46vh;overflow:auto;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.paper .cur{display:inline-block;width:.55em;height:1em;background:#000;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menubar{display:flex;gap:14px;font-size:19px;padding:0 4px 6px}
.menubar u{text-decoration:underline}
#bq{display:block;width:100%;image-rendering:pixelated;background:#fff}
.list{background:#fff;padding:8px 10px;font-size:20px;line-height:1.3}
.list li{list-style:none}
.runner{position:relative}
.yes-big{transition:transform .2s steps(3)}

/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;padding:4px;background:var(--silver);display:flex;gap:4px;align-items:center;z-index:900;box-shadow:inset 0 1px var(--light),inset 0 2px var(--hilite)}
#start{height:34px;padding:0 10px;border:0;background:var(--silver);font:22px/1 var(--px);font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.task{height:34px;min-width:0;max-width:170px;flex:1 1 0;padding:0 8px;border:0;background:var(--silver);font:18px/1 var(--px);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tray{height:34px;padding:0 10px;display:flex;align-items:center;gap:8px;font:19px/1 var(--px);flex:none}
.tray button{border:0;background:none;cursor:pointer;font-size:18px;padding:0}
#menu{position:fixed;left:4px;bottom:44px;z-index:950;background:var(--silver);padding:3px;display:flex;min-width:260px}
#menu .side{width:30px;background:linear-gradient(0deg,var(--title1),var(--title2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font:24px/30px var(--px);padding:8px 0;text-align:left}
#menu .side b{color:#FFE1F0}
#menu ul{list-style:none;padding:2px;flex:1}
#menu li button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;font:21px/1 var(--px);text-align:left;cursor:pointer;color:#000}
#menu li button:hover,#menu li button:focus-visible{background:var(--navy);color:#fff;outline:0}
#menu li button span{font-size:24px;width:30px;text-align:center}
#menu hr{border:0;border-top:1px solid var(--dark);border-bottom:1px solid #fff;margin:3px 4px}
#menu a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;padding:8px 10px;font:21px/1 var(--px)}
#menu a:hover{background:var(--navy);color:#fff}
#menu a span{font-size:24px;width:30px;text-align:center}
#menu .sub{padding-left:10px;font-size:19px}

/* cat assistant */
#cat{position:fixed;right:10px;bottom:54px;z-index:800;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(300px,calc(100vw - 20px))}
#cat .bubble{background:var(--tip);border:1px solid #000;padding:10px 12px;font:20px/1.15 var(--px);position:relative;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
#cat .bubble::after{content:"";position:absolute;right:26px;bottom:-9px;width:14px;height:14px;background:var(--tip);border-right:1px solid #000;border-bottom:1px solid #000;transform:rotate(45deg)}
#cat .bubble .row{justify-content:flex-start;margin-top:10px;gap:6px}
#cat .bubble .btn{min-width:0;font-size:18px;padding:5px 10px}
#cat .face{width:66px;height:66px;font-size:46px;display:grid;place-items:center;background:var(--silver);cursor:pointer;animation:bob 1.6s steps(2) infinite;border:0}
@keyframes bob{50%{transform:translateY(-4px)}}

/* boot + shutdown */
.screen{position:fixed;inset:0;z-index:2000;background:#000;color:#C8C8C8;font:clamp(18px,4.6vw,24px)/1.25 var(--px);padding:max(18px,env(safe-area-inset-top)) 18px;cursor:pointer}
.screen pre{white-space:pre-wrap;font:inherit}
.logo{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;text-align:center;background:linear-gradient(#000,#14001F)}
.logo h1{font:clamp(54px,15vw,120px)/1 var(--px);color:#fff;letter-spacing:.02em}
.logo h1 b{color:var(--pink)}
.logo p{font-size:clamp(18px,4.6vw,24px);color:#bbb}
.knight{width:min(260px,70vw);height:16px;border:2px solid #555;position:relative;overflow:hidden}
.knight i{position:absolute;top:2px;bottom:2px;width:46px;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,transparent 10px 14px);animation:kr 1.2s linear infinite}
@keyframes kr{from{left:-50px}to{left:100%}}
#shutdown{display:grid;place-items:center;text-align:center;color:#F7A23B;font-size:clamp(26px,7vw,46px);line-height:1.15;padding:24px}
#shutdown small{display:block;color:#777;font-size:.5em;margin-top:24px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:3000;background:var(--tip);border:1px solid #000;padding:8px 12px;font:20px var(--px);box-shadow:3px 3px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .2s steps(2);pointer-events:none;max-width:calc(100vw - 24px);text-align:center}
.toast.on{opacity:1}
label.fld{display:grid;gap:4px;font-size:20px;margin-top:8px}
label.fld input,label.fld textarea{font:20px var(--px);padding:6px 8px;border:0;background:#fff;width:100%;user-select:text;-webkit-user-select:text}
label.fld textarea{min-height:90px;resize:vertical}
@media (max-width:600px){
  .icons{grid-template-columns:repeat(4,1fr);left:4px;right:4px;top:6px}
  .icon{width:auto}
  .watermark{bottom:auto;top:40%}
}
@media (prefers-reduced-motion:reduce){.cloud,.knight i,#cat .face{animation:none}}
body.og *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="desk">
  <div class="cloud" style="top:12%;animation-delay:-12s"></div>
  <div class="cloud" style="top:34%;animation-duration:80s;animation-delay:-50s;transform:scale(.7)"></div>
  <div class="watermark" aria-hidden="true">20.10<small>THIỆPOS · PHIÊN BẢN DÀNH RIÊNG CHO <span data-to>BẠN</span></small></div>
  <nav class="icons" aria-label="Biểu tượng trên màn hình">
    <button class="icon" data-app="wish"><span class="ic">📄</span><span class="lb">Lời chúc.txt</span></button>
    <button class="icon" data-app="flower"><span class="ic">💐</span><span class="lb">Bó hoa.exe</span></button>
    <button class="icon" data-app="scan"><span class="ic">🛡️</span><span class="lb">Quét virus.exe</span></button>
    <button class="icon" data-app="trash"><span class="ic">🗑️</span><span class="lb">Thùng rác</span></button>
  </nav>
</div>

<div id="bar">
  <button id="start" class="bevel" aria-expanded="false">🌸 Bắt đầu</button>
  <div id="tasks"></div>
  <div class="tray sunken"><button id="snd" aria-label="Bật/tắt âm thanh">🔊</button><span id="clock">20/10</span></div>
</div>
<div id="menu" class="bevel" hidden>
  <div class="side"><b>Thiệp</b>OS 20.10</div>
  <ul>
    <li><button data-act="make"><span>✏️</span>Tạo thiệp của bạn</button></li>
    <li><button data-act="story"><span>📸</span>Lưu ảnh Story</button></li>
    <li><button data-act="cat"><span>🐱</span>Gọi Mèo trợ lý</button></li>
    <hr>
    <li><div class="sub">🎨 Kiểu thiệp khác:</div></li>
    <li id="verLinks"></li>
    <hr>
    <li><button data-act="off"><span>⏻</span>Tắt máy…</button></li>
  </ul>
</div>

<div id="cat" hidden>
  <div class="bubble" id="catBubble"></div>
  <button class="face bevel" id="catFace" aria-label="Mèo trợ lý">🐱</button>
</div>

<div class="screen" id="boot"><pre id="bootText"></pre><div class="logo" id="logo" hidden><h1>Thiệp<b>OS</b> 20.10</h1><div class="knight"><i></i></div><p>Đang khởi động yêu thương…</p></div></div>
<div class="screen" id="shutdown" hidden><div>Giờ bạn có thể tắt máy<br>và ra ngoài tận hưởng 20/10 an toàn. 🌸<small>(chạm để khởi động lại)</small></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = new URLSearchParams(location.search);
const OG = P.has('og');
const cut = (s, n) => (s || '').normalize('NFC').replace(/\s+/g, ' ').trim().slice(0, n);
const DKEY = 'thiep2010:draft';
function loadDraft() { try { return JSON.parse(sessionStorage.getItem(DKEY) || '{}') || {}; } catch (e) { return {}; } }
// URL parameters are ignored on purpose: names live only on this device, never in a link
const D0 = loadDraft();
const S = { to: cut(D0.to, 40) || 'bạn', from: cut(D0.from, 40), m: cut(D0.m, 320), nick: cut(D0.nick, 30) };
function saveDraft(s = S) { try { sessionStorage.setItem(DKEY, JSON.stringify({ to: s.to === 'bạn' ? '' : s.to, from: s.from, m: s.m, nick: s.nick })); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 60) : ms));
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[(Math.random() * a.length) | 0];
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const wishText = () => S.m || `Chúc ${S.to} một ngày 20/10 thật vui:\n- Luôn xinh đẹp (đã xác minh, không cần cập nhật)\n- Lương tăng đều như dung lượng ổ cứng\n- Deadline chạy chậm như mạng thời quay số\n- Buồn phiền thì Ctrl + Z ngay lập tức\n\nMãi là phiên bản tốt nhất của chính mình nhé! 💐`;
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
document.querySelectorAll('[data-to]').forEach(e => e.textContent = S.to.toUpperCase());
document.title = S.to !== 'bạn' ? `Thiệp.exe · Gửi ${S.to}` : 'Thiệp.exe';

/* ---------- 8-bit sound ---------- */
let AC = null, soundOn = true;
function initAudio() { if (AC) { AC.state === 'suspended' && AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function beep(f, d = .09, when = 0, type = 'square', vol = .05, slide = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const SFX = {
  click: () => beep(1200, .03, 0, 'square', .03),
  open: () => { beep(660, .06); beep(990, .08, .06); },
  close: () => { beep(700, .05); beep(440, .07, .05); },
  error: () => { beep(880, .12, 0, 'square', .06); beep(587, .2, .13, 'square', .06); },
  tada: () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .14, i * .09, 'square', .045)),
  boot: () => [392, 523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, .16, i * .12, 'triangle', .07)),
  meow: () => { beep(700, .25, 0, 'triangle', .07, 1100); beep(1100, .3, .25, 'triangle', .06, 600); },
  run: () => beep(300 + Math.random() * 900, .05, 0, 'square', .04, 1800),
  crumple: () => { for (let i = 0; i < 8; i++) beep(150 + Math.random() * 200, .04, i * .03, 'sawtooth', .03); }
};
$('#snd').addEventListener('click', () => { soundOn = !soundOn; $('#snd').textContent = soundOn ? '🔊' : '🔇'; initAudio(); SFX.click(); });
document.addEventListener('pointerdown', () => initAudio(), { once: false, capture: true });

/* ---------- clock ---------- */
function tickClock() { const d = new Date(); $('#clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} · 20/10`; }
tickClock(); setInterval(tickClock, 15000);

/* ---------- window manager ---------- */
const desk = $('#desk'), tasks = $('#tasks');
let zTop = 20, cascade = 0;
const isPhone = () => innerWidth < 600;
function focusWin(w) {
  document.querySelectorAll('.win').forEach(x => x.classList.toggle('blur', x !== w));
  w.style.zIndex = ++zTop;
  document.querySelectorAll('.task').forEach(t => t.classList.toggle('on', t.dataset.win === w.id && !w.hidden));
}
function openWin({ id, title, icon = '🗔', html = '', width = 420, x, y, onClose, closable = true }) {
  let w = document.getElementById(id);
  if (w) { w.hidden = false; focusWin(w); return w; }
  w = document.createElement('section'); w.className = 'win bevel pop'; w.id = id; w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', title);
  w.innerHTML = `<header class="tb"><span class="ti">${icon} ${esc(title)}</span><span class="tbb"><button class="tbtn bevel" data-min aria-label="Thu nhỏ">_</button>${closable ? '<button class="tbtn bevel" data-x aria-label="Đóng">✕</button>' : ''}</span></header><div class="wb">${html}</div>`;
  const vw = innerWidth, vh = innerHeight - 44, ww = Math.min(width, vw - 12);
  w.style.width = ww + 'px';
  const cx = x ?? (isPhone() ? (vw - ww) / 2 : Math.max(8, (vw - ww) / 2 + (cascade % 5) * 26 - 50));
  const cy = y ?? (isPhone() ? 112 + (cascade % 4) * 22 : Math.max(8, vh * .14 + (cascade % 5) * 26));
  cascade++;
  w.style.left = Math.max(4, Math.min(cx, vw - ww - 4)) + 'px'; w.style.top = Math.max(4, cy) + 'px';
  desk.appendChild(w);
  w._onClose = onClose;
  w.addEventListener('pointerdown', () => focusWin(w));
  w.querySelector('[data-x]')?.addEventListener('click', () => closeWin(w));
  w.querySelector('[data-min]').addEventListener('click', () => { w.hidden = true; SFX.click(); focusWin(w); });
  drag(w);
  const t = document.createElement('button'); t.className = 'task bevel'; t.dataset.win = id; t.textContent = `${icon} ${title}`;
  t.addEventListener('click', () => { if (w.hidden || w.style.zIndex < zTop) { w.hidden = false; focusWin(w); } else { w.hidden = true; focusWin(w); } SFX.click(); });
  tasks.appendChild(t);
  focusWin(w); SFX.open();
  // keep tall windows on screen
  requestAnimationFrame(() => { const r = w.getBoundingClientRect(); if (r.bottom > vh) w.style.top = Math.max(4, vh - r.height - 6) + 'px'; });
  return w;
}
function closeWin(w, silent) {
  if (!w || !w.isConnected) return;
  w.classList.remove('pop'); w.classList.add('closing');
  if (!silent) SFX.close();
  setTimeout(() => { w.remove(); tasks.querySelector(`[data-win="${w.id}"]`)?.remove(); w._onClose && w._onClose(); }, 170);
}
function drag(w) {
  const tb = w.querySelector('.tb');
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = w.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
    tb.setPointerCapture(e.pointerId); tb.style.cursor = 'grabbing';
    const mv = ev => { w.style.left = Math.max(-r.width + 60, Math.min(innerWidth - 60, ev.clientX - ox)) + 'px'; w.style.top = Math.max(0, Math.min(innerHeight - 80, ev.clientY - oy)) + 'px'; };

const PALS = [['#FF5C8A', '#FFC2D4'], ['#FFB000', '#FFE8A3'], ['#9B5CFF', '#E2CCFF'], ['#FF7A3D', '#FFD3BF'], ['#FFFFFF', '#FFE3EE'], ['#3DC9C9', '#C2F5F5']];
function makeFlowers(n = 9, extra = false) {
  const a = [];
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (Math.random() - .5) * 1.9, d = 14 + Math.random() * 11;
    a.push({ x: 32 + Math.cos(ang) * d, y: 36 + Math.sin(ang) * d * .9, r: 2.5 + Math.random() * 2, p: pick(PALS), delay: extra ? 0 : Math.random() * 1.6 });
  }
  return a;
}
function px(c, x, y, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); }
function drawBouquet(c, fl, t) {
  c.fillStyle = '#FFF7FB'; c.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 18; i++) px(c, (i * 13) % 64, (i * 29 + Math.floor(t * 6)) % 64, '#FFE0EC');
  // stems
  for (const f of fl) { const k = Math.min(1, t / 1.2); c.strokeStyle = '#2E9E5B'; c.lineWidth = 1; c.beginPath(); c.moveTo(32.5, 50.5); c.lineTo(32.5 + (f.x - 32) * k, 50.5 + (f.y - 50) * k); c.stroke(); }
  // flowers bloom
  for (const f of fl) {
    const k = Math.max(0, Math.min(1, (t - 1 - f.delay) / .6)); if (!k) continue;
    const r = Math.max(1, Math.round(f.r * k)), wob = Math.round(Math.sin(t * 2 + f.x) * .6);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) px(c, f.x + dx + wob, f.y + dy, (dx + dy) < -1 ? f.p[1] : f.p[0]);
    px(c, f.x + wob, f.y, '#FFD23F');
  }
  // wrap
  c.fillStyle = '#F49AC1'; c.beginPath(); c.moveTo(18, 44); c.lineTo(46, 44); c.lineTo(35, 62); c.lineTo(29, 62); c.closePath(); c.fill();
  c.fillStyle = '#B4246C'; for (let y = 45; y < 62; y += 3) c.fillRect(30 + ((y / 3) % 2), y, 1, 1);
  c.fillStyle = '#FFFFFF'; c.fillRect(27, 50, 10, 2);
  c.fillStyle = '#B4246C'; c.fillRect(31, 49, 2, 4);
  // sparkle
  if (t > 2.5) { const s = Math.floor(t * 3) % 4; px(c, 10 + s * 12, 10 + (s % 2) * 6, '#FFD23F'); px(c, 52 - s * 9, 18 + s * 3, '#FF5C8A'); }
}
